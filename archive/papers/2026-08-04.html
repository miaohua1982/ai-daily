<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 学术档案库 · 近日论文精选</title>
<style>
    :root {
        --hero-from: #ff5e3a;
        --hero-mid: #f73b4a;
        --hero-to: #c0392b;
        --accent: #ff6b35;
        --accent-dark: #e0552b;
        --accent-light: rgba(255,107,53,.08);
        --bg: #faf8f6;
        --card-bg: #ffffff;
        --card-border: #ede8e2;
        --text: #2c2c2c;
        --text-secondary: #6b6b6b;
        --text-muted: #999999;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
        --shadow-md: 0 4px 12px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
        --shadow-lg: 0 12px 32px rgba(0,0,0,.1), 0 4px 8px rgba(0,0,0,.05);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --timeline-dot: #ff6b35;
        --timeline-line: #ede8e2;
        --timeline-active-bg: rgba(255,107,53,.06);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
      }

      /* ========= HEADER (matching daily hero) ========= */
      .header {
        position: relative; overflow: hidden;
        background: linear-gradient(135deg, var(--hero-from) 0%, var(--hero-mid) 40%, var(--hero-to) 100%);
        color: #fff;
        padding: 40px 24px 36px;
        text-align: center;
        z-index: 100;
        box-shadow: 0 4px 20px rgba(0,0,0,.15);
      }
      .header::before {
        content: '';
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 70% 30%, rgba(255,255,255,.15) 0%, transparent 60%),
                    radial-gradient(ellipse at 20% 80%, rgba(255,200,120,.12) 0%, transparent 50%);
      }
      .header-inner {
        position: relative; z-index: 1;
        max-width: 720px; margin: 0 auto;
        display: flex; flex-direction: column; align-items: center; gap: 16px;
      }
      .header-badge {
        display: inline-block;
        background: rgba(255,255,255,.2);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 100px;
        padding: 4px 16px;
        font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
      }
      .header-title {
        font-size: clamp(22px, 4vw, 32px);
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .header-sub {
        font-size: 14px;
        opacity: 0.85;
      }
      .header-stats {
        display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
      }
      .stat-card {
        display: flex; flex-direction: column; align-items: center;
        background: rgba(255,255,255,.15);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,.2);
        border-radius: var(--radius-md);
        padding: 10px 18px; min-width: 80px;
      }
      .stat-num { font-size: 24px; font-weight: 800; line-height: 1.2; }
      .stat-label { font-size: 11px; opacity: 0.8; margin-top: 2px; }

      /* ========= LAYOUT ========= */
      .main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 24px 48px;
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 24px;
        align-items: start;
      }

      /* ========= TIMELINE ========= */
      .timeline {
        position: sticky;
        top: 24px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 16px 12px;
        box-shadow: var(--shadow-sm);
      }
      .timeline-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: .8px;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--card-border);
      }
      .timeline-list { list-style: none; position: relative; }
      .timeline-list::before {
        content: '';
        position: absolute;
        left: 8px; top: 4px; bottom: 4px;
        width: 2px;
        background: linear-gradient(to bottom, var(--timeline-dot), var(--card-border));
        border-radius: 2px;
      }
      .timeline-item {
        position: relative;
        padding: 5px 0 5px 22px;
        cursor: pointer;
        border-radius: 6px;
        transition: background .15s;
      }
      .timeline-item:hover { background: var(--accent-light); }
      .timeline-item.active { background: var(--accent-light); }
      .timeline-item::before {
        content: '';
        position: absolute;
        left: 4px; top: 50%;
        transform: translateY(-50%);
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--card-bg);
        border: 2px solid var(--card-border);
        transition: border-color .15s, background .15s;
      }
      .timeline-item:hover::before,
      .timeline-item.active::before {
        border-color: var(--timeline-dot);
        background: var(--timeline-dot);
      }
      .timeline-date { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
      .timeline-count { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

      /* ========= PAPER LIST ========= */
      .papers-section { display: flex; flex-direction: column; gap: 0; }
      .date-group { margin-bottom: 32px; }
      .date-anchor { display: block; height: 1px; margin-top: -90px; padding-top: 90px; pointer-events: none; }
      .date-header {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--card-border);
      }
      .date-pill {
        background: var(--accent);
        color: white;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 12px;
        border-radius: 100px;
      }
      .date-weekday { font-size: 12px; color: var(--text-muted); }
      .date-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }

      .papers-stack { display: flex; flex-direction: column; gap: 12px; }

      /* ========= PAPER CARD ========= */
      .paper-card {
        position: relative;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 20px 20px 16px;
        box-shadow: 0 1px 3px rgba(0,0,0,.06);
        transition: var(--transition);
        display: flex; flex-direction: column;
        opacity: 0;
        transform: translateY(18px);
      }
      .paper-card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .paper-card:hover {
        box-shadow: 0 4px 12px rgba(0,0,0,.07);
        transform: translateY(-2px);
      }
      .paper-card.visible:hover {
        transform: translateY(-2px);
      }
      .paper-card.selected-card {
        border-left: 3px solid var(--accent);
      }

      .card-header {
        display: flex; align-items: flex-start; gap: 10px;
        margin-bottom: 10px;
      }
      .card-num {
        position: absolute; top: -10px; left: 14px;
        background: var(--accent); color: #fff;
        font-size: 11px; font-weight: 700;
        width: 24px; height: 24px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 2px 6px rgba(255,107,53,.35);
        flex-shrink: 0;
      }
      .selected-card .card-num {
        background: var(--accent-dark);
        box-shadow: 0 2px 8px rgba(255,107,53,.5);
      }

      .card-title-wrap { flex: 1; min-width: 0; margin-top: 6px; }
      .card-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.5;
        text-decoration: none;
        display: block;
      }
      .card-title:hover { color: var(--accent); }

      .card-meta {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        margin-top: 6px;
      }
      .badge {
        display: inline-block;
        font-size: 11px; font-weight: 600;
        padding: 3px 10px; border-radius: 100px;
        white-space: nowrap;
        max-width: 160px;
        overflow: hidden; text-overflow: ellipsis;
      }
      .rel-time {
        font-size: 11px;
        color: var(--text-muted);
      }
      .score-dot {
        margin-left: auto;
        font-size: 11px;
        color: var(--text-muted);
        display: flex; align-items: center; gap: 3px;
      }
      .score-star { color: #F6C90E; }

      .card-summary {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.65;
        margin-bottom: 14px;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card-footer {
        display: flex; align-items: center; justify-content: flex-end;
        margin-top: auto;
        padding-top: 10px;
        border-top: 1px solid var(--card-border);
      }
      .read-link {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 13px; font-weight: 600;
        color: var(--accent);
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 100px;
        background: var(--accent-light);
        transition: var(--transition);
      }
      .read-link:hover {
        background: rgba(255,107,53,.16);
        color: var(--accent-dark);
      }
      .read-link svg { width: 14px; height: 14px; }

      /* ========= SEARCH BAR ========= */
      .search-bar {
        grid-column: 1 / -1;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-md);
        padding: 10px 16px;
        box-shadow: var(--shadow-sm);
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 4px;
      }
      .search-input {
        border: none; outline: none;
        width: 100%;
        font-size: 14px;
        color: var(--text);
        background: transparent;
      }
      .search-input::placeholder { color: var(--text-muted); }
      .search-icon { color: var(--text-muted); flex-shrink: 0; }
      .search-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

      /* ========= FOOTER ========= */
      .footer {
        text-align: center;
        padding: 32px 16px 40px;
        border-top: 1px solid var(--card-border);
        color: var(--text-muted);
        font-size: 13px;
        max-width: 1200px; margin: 0 auto;
      }
      .footer a { color: var(--accent); text-decoration: none; }
      .footer a:hover { text-decoration: underline; }

      /* ========= BACK TO TOP ========= */
      .quick-top {
        position: fixed; bottom: 24px; right: 24px;
        width: 44px; height: 44px; border-radius: 50%;
        background: var(--accent); color: #fff;
        border: none; cursor: pointer; font-size: 20px;
        box-shadow: 0 12px 32px rgba(0,0,0,.1);
        opacity: 0; transform: translateY(12px);
        pointer-events: none; transition: var(--transition); z-index: 200;
        display: flex; align-items: center; justify-content: center;
      }
      .quick-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
      .quick-top:hover { background: var(--accent-dark); }

      /* ========= RESPONSIVE ========= */
      @media (max-width: 768px) {
        .header { padding: 32px 16px 28px; }
        .header-stats { gap: 10px; }
        .stat-card { padding: 8px 14px; min-width: 64px; }
        .stat-num { font-size: 20px; }
        .main {
          grid-template-columns: 1fr;
          padding: 16px;
        }
        .timeline { position: static; display: none; }
        .search-bar { grid-column: 1; }
        .card-title { font-size: 14px; }
        .paper-card { padding: 16px 16px 14px; }
      }
    
</style>
</head>

{"idx": 20, "title": "RayViT：用于视角鲁棒模仿学习的射线条件视觉表示", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:56:33Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29622v1", "summary": "视觉模仿学习使机器人能够直接从图像中获取视觉运动技能，但RGB观测缺乏显式的几何线索，使得学习到的策略对相机扰动脆弱。为解决这一问题，我们提出了\\textbf{射线条件视觉Transformer编码器（RayViT）}，一种轻量级架构，将相机几何注入预训练的ViT骨干网络。RayViT将相机几何表示为Plücker射线图，将其分块为射线特征，并使用门控交叉注意力...", "selected": false, "score": 0},
{"idx": 21, "title": "CENDRe：基于自然领域表示的概念提取", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:56:27Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29621v1", "summary": "卷积神经网络（CNNs）广泛用于时间序列分类，但在关键领域的部署需要理解驱动其预测的时间和频谱模式。概念提取（CE）方法通过分析模型潜在空间中的表示来识别这些模式。然而，现有的时间序列CE方法存在三个局限性：它们仅在时域中操作，忽略了频率特征，预定义了概念的数量，", "selected": false, "score": 0},
{"idx": 22, "title": "何时在线交互有帮助？基于价值的模仿学习中的表示权衡", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:52:47Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29617v1", "summary": "模仿学习（IL）——训练智能体从示范中复制专家行为——支撑着从机器人技术到语言模型训练的应用。标准方法如行为克隆（BC）已知会遭受复合误差和性能平台期，特别是当学习者无法完美表示专家策略时（例如，在蒸馏中很常见）。两种干预措施在经验上被广泛认为可以提高性能：查询专家交互", "selected": false, "score": 0},
{"idx": 23, "title": "可解释性-性能系数的人本验证", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:50:51Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29614v1", "summary": "深度学习模型在高风险领域的快速采用加剧了对可信赖的可解释人工智能（XAI）的需求。然而，客观评估解释保真度并将XAI指标与以人为中心的理解对齐仍然是关键的开放挑战。在这项工作中，我们提出了一种模型无关的指标，即EPC分数，它是可解释性-性能系数（EPC）的扩展，通过明确平衡训练", "selected": false, "score": 0},
{"idx": 24, "title": "WCM：用于视觉-语言-动作强化学习的世界评论家模型", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:48:45Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29613v1", "summary": "视觉-语言-动作（VLA）模型的强化学习（RL）后训练在机器人操作中显示出强大的前景。在RL方法中，基于评论家的方法依赖于价值估计器，该估计器主要基于单帧观察或单帧VLM骨干潜在变量，这与机器人控制的部分可观察性本质存在根本性不匹配。将观察历史纳入评论家的朴素方法会导致高维度的指数复杂度", "selected": false, "score": 0},
{"idx": 25, "title": "QASP：查询自适应的鲁棒向量搜索策略", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:38:47Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29606v1", "summary": "向量搜索的一个基本挑战是在最小化计算成本的同时实现持续的高召回率。固定的搜索参数会导致查询间显著的性能差异，而传统的平均召回率评估掩盖了这些逐查询差异。我们引入了QASP（查询自适应鲁棒向量搜索策略），它通过一次性的监督回归预测每个查询的完整召回率进展曲线，从中推导出任何召回率下的搜索策略", "selected": false, "score": 0},
{"idx": 26, "title": "FriendBench：人类与多模态大语言模型中二元熟悉度推断的基准测试", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:33:39Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29602v1", "summary": "理解社交情境往往依赖于行为，而非仅凭言语。我们引入了FriendBench，一个从20秒的二元破冰对话片段中推断两人是熟人还是陌生人的基准测试。每对参与者回答相同类型的提示，因此只有互动方式才能揭示答案。我们通过文本、音频和视频，将来自七家公司的26个模型与匹配的人类评审小组在96个平衡的二元组上进行了比较。最佳模型和人类表现之间的差距凸显了当前模型在捕捉细微社交线索方面的不足。", "selected": false, "score": 0},
{"idx": 27, "title": "部分大于整体：面向多策略LLM高效训练的自动化任务排序", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:33:18Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29601v1", "summary": "参数高效微调（PEFT）通常使用单个共享的低秩适配器（LoRA）来适配大型语言模型。这种共享的优化空间在适应异构任务序列时常常遭受干扰，导致迁移效果差和灾难性遗忘。现有方法主要通过增加参数容量或组合多个适配器来提升适配器的表达能力，但它们仍然依赖于共享的优化路径。在本文中，我们提出了一种优化方法，通过自动化任务排序来减少干扰，从而提升多策略LLM的训练效率。", "selected": false, "score": 0},
{"idx": 28, "title": "HAM-VLN：利用分层智能体记忆实现零样本视觉-语言导航", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:32:38Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29600v1", "summary": "视觉-语言导航（VLN）使机器人能够在未见过的环境中遵循指令。最近，一种免训练范式出现：机器人查询多模态LLM以理解其观察并规划下一步动作。然而，基于图像流或密集地图的长时程导航不可避免地引入了不断增长的记忆和推理瓶颈。我们提出了HAM-VLN，一种决策耦合、智能体编写的记忆，为机器人配备了持久、深度的记忆机制，以支持高效的长时程导航。", "selected": false, "score": 0},
{"idx": 29, "title": "FibVLA：基于斐波那契采样的高效时序视觉-语言-动作模型", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:23:07Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29596v1", "summary": "视觉-语言-动作模型（VLA）利用多模态信息的认知来推断物理世界中的动作，为具身AI应用提供了通用解决方案。传统VLA通常专注于当前的数字认知。虽然已有一些工作通过捕获时序信息来增强VLA的推理能力，但编码长上下文历史会导致效率下降的问题。为了调和捕获时序信息与效率之间的矛盾，我们提出了FibVLA，一种基于斐波那契采样的高效时序VLA模型。", "selected": false, "score": 0},
{"idx": 30, "title": "CoDe-SSM：用于高效超高清图像恢复的上下文-细节解耦状态空间模型", "source": "arxiv", "badgeLabel": "arxiv", "badgeBg": "#fce4ec", "badgeColor": "#c0392b", "publishedAt": "2026-07-31T16:23:06Z", "dateStr": "2026-07-31", "url": "https://arxiv.org/abs/2607.29595v1", "summary": "超高清（UHD）图像恢复必须在聚合空间重复出现的退化线索与保留局部图像结构之间取得平衡。紧凑的聚合可以减少冗余处理，但可能会削弱边缘、纹理和其他精细结构。现有方法通过下采样、窗口划分或基于聚类的令牌减少来管理UHD恢复成本；然而，其中许多方法并未显式保留那些在共享聚合中表现不佳的信息。我们提出了CoDe-SSM，一种上下文-细节解耦的状态空间模型，以高效地处理UHD图像恢复。", "selected": false, "score": 0},

<script>
(function(){
  var WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  function relativeTime(isoStr){
    var now = Date.now();
    var t = new Date(isoStr).getTime();
    var diff = Math.floor((now - t) / 1000);
    if(diff < 60) return '刚刚';
    if(diff < 3600) return Math.floor(diff/60) + ' 分钟前';
    if(diff < 86400) return Math.floor(diff/3600) + ' 小时前';
    if(diff < 604800) return Math.floor(diff/86400) + ' 天前';
    return new Date(isoStr).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
  }

  function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

  function buildTimeline(){
    var list = document.getElementById('timelineList');
    if(!list) return;
    list.innerHTML = '';
    window.TIMELINE_DATA.forEach(function(g){
      var li = document.createElement('li');
      li.className = 'timeline-item';
      li.dataset.date = g.date;
      li.innerHTML = '<div class="timeline-date">' + g.date.slice(5) + '</div>'
        + '<div class="timeline-count">' + g.wd + ' · ' + g.count + ' 篇</div>';
      li.addEventListener('click', function(){
        var el = document.getElementById('anchor-' + g.date);
        if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      });
      list.appendChild(li);
    });
  }

  function buildCards(filtered){
    var section = document.getElementById('papersSection');
    if(!section) return;
    section.innerHTML = '';

    var groups = {};
    filtered.forEach(function(p){
      if(!groups[p.dateStr]) groups[p.dateStr] = [];
      groups[p.dateStr].push(p);
    });
    var sortedDates = Object.keys(groups).sort(function(a,b){ return b.localeCompare(a); });

    var timelineGroups = sortedDates.map(function(d){
      return {date:d, wd:WEEKDAYS[new Date(d+'T00:00:00+08:00').getDay()], count:groups[d].length};
    });
    window.TIMELINE_DATA = timelineGroups;
    buildTimeline();

    sortedDates.forEach(function(date){
      var grp = groups[date];
      var d = new Date(date + 'T00:00:00+08:00');
      var wd = WEEKDAYS[d.getDay()];
      var groupEl = document.createElement('div');
      groupEl.className = 'date-group';
      var anchor = document.createElement('div');
      anchor.className = 'date-anchor';
      anchor.id = 'anchor-' + date;
      groupEl.appendChild(anchor);
      var header = document.createElement('div');
      header.className = 'date-header';
      header.innerHTML = '<span class="date-pill">' + date + '</span>'
        + '<span class="date-weekday">' + wd + '</span>'
        + '<span class="date-count">' + grp.length + ' 篇</span>';
      groupEl.appendChild(header);
      var stack = document.createElement('div');
      stack.className = 'papers-stack';

      grp.forEach(function(p){
        var card = document.createElement('div');
        card.className = 'paper-card' + (p.selected ? ' selected-card' : '');
        card.dataset.id = p.idx;
        var shtml = '';
        if(p.summary && p.summary !== '暂无摘要'){
          shtml = '<div class="card-summary">' + escHtml(p.summary) + '</div>';
        }
        card.innerHTML =
          '<div class="card-header">' +
            '<div class="card-num">' + p.idx + '</div>' +
            '<div class="card-title-wrap">' +
              '<a class="card-title" href="' + escAttr(p.url) + '" target="_blank" rel="noopener">' + escHtml(p.title) + '</a>' +
              '<div class="card-meta">' +
                '<span class="badge" style="background:' + escAttr(p.badgeBg) + ';color:' + escAttr(p.badgeColor) + '" title="' + escAttr(p.source) + '">' + escHtml(p.badgeLabel) + '</span>' +
                '<span class="rel-time">' + relativeTime(p.publishedAt) + '</span>' +
                '<span class="score-dot"><span class="score-star">\u2605</span>' + p.score + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          shtml +
          '<div class="card-footer">' +
            '<a class="read-link" href="' + escAttr(p.url) + '" target="_blank" rel="noopener">' +
              '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\" fill=\"currentColor\"><path d=\"M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5z\"/><path d=\"M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0v-5z\"/></svg>' + ' 阅读原文</a>' +
          '</div>';
        stack.appendChild(card);
      });
      groupEl.appendChild(stack);
      section.appendChild(groupEl);
    });

    document.getElementById('filtered-count').textContent = filtered.length;

    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add('visible'); observer.unobserve(e.target); }
      });
    }, {threshold:0.08, rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.paper-card').forEach(function(el){ observer.observe(el); });

    highlightTimeline();
  }

  function highlightTimeline(){
    var groups = document.querySelectorAll('.date-group');
    var tItems = document.querySelectorAll('.timeline-item');
    var scrollY = window.scrollY + 160;
    var activeDate = null;
    groups.forEach(function(g){
      var anchor = g.querySelector('.date-anchor');
      if(anchor && anchor.getBoundingClientRect().top + window.scrollY <= scrollY){
        activeDate = g.querySelector('.date-anchor').id.replace('anchor-','');
      }
    });
    tItems.forEach(function(item){
      item.classList.toggle('active', item.dataset.date === activeDate);
    });
  }

  window.addEventListener('scroll', highlightTimeline, {passive:true});

  var searchInput = document.getElementById('searchInput');
  var searchCount = document.getElementById('searchCount');
  var debounceTimer;
  if(searchInput){
    searchInput.addEventListener('input', function(){
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function(){
        var q = searchInput.value.trim().toLowerCase();
        var filtered;
        if(!q){ filtered = window.PAPERS; }
        else { filtered = window.PAPERS.filter(function(p){
          return (p.title && p.title.toLowerCase().indexOf(q)!==-1)
              || (p.summary && p.summary.toLowerCase().indexOf(q)!==-1)
              || (p.source && p.source.toLowerCase().indexOf(q)!==-1)
              || (p.badgeLabel && p.badgeLabel.toLowerCase().indexOf(q)!==-1);
        }); }
        searchCount.textContent = filtered.length + ' 篇';
        buildCards(filtered);
      }, 250);
    });
  }

  buildCards(window.PAPERS);
  buildTimeline();

  /* ---- back to top ---- */
  var qtop = document.getElementById('quickTop');
  window.addEventListener('scroll', function(){
    qtop.classList.toggle('visible', window.scrollY > 400);
  });
})();

</script>

<div class="quick-top" id="quickTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>

</body>
</html>
