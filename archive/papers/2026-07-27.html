<style>
    :root {

        --hero-mid: #f73b4a;
        --hero-to: #c0392b;
        --accent: #ff6b35;
        --accent-dark: #e0552b;
        --accent-light: rgba(255,107,53,.08);
        --bg: #faf8f6;
        --card-bg: #ffffff;
        --card-border: #ede8e2;
        --text: #2c2c2c;
        --text-secondary: #6b6b6b;
        --text-muted: #999999;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
        --shadow-md: 0 4px 12px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
        --shadow-lg: 0 12px 32px rgba(0,0,0,.1), 0 4px 8px rgba(0,0,0,.05);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --timeline-dot: #ff6b35;
        --timeline-line: #ede8e2;
        --timeline-active-bg: rgba(255,107,53,.06);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
      }

      /* ========= HEADER (matching daily hero) ========= */
      .header {
        position: relative; overflow: hidden;
        background: linear-gradient(135deg, var(--hero-from) 0%, var(--hero-mid) 40%, var(--hero-to) 100%);
        color: #fff;
        padding: 40px 24px 36px;
        text-align: center;
        z-index: 100;
        box-shadow: 0 4px 20px rgba(0,0,0,.15);
      }
      .header::before {
        content: '';
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 70% 30%, rgba(255,255,255,.15) 0%, transparent 60%),
                    radial-gradient(ellipse at 20% 80%, rgba(255,200,120,.12) 0%, transparent 50%);
      }
      .header-inner {
        position: relative; z-index: 1;
        max-width: 720px; margin: 0 auto;
        display: flex; flex-direction: column; align-items: center; gap: 16px;
      }
      .header-badge {
        display: inline-block;
        background: rgba(255,255,255,.2);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 100px;
        padding: 4px 16px;
        font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
      }
      .header-title {
        font-size: clamp(22px, 4vw, 32px);
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .header-sub {
        font-size: 14px;
        opacity: 0.85;
      }
      .header-stats {
        display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
      }
      .stat-card {
        display: flex; flex-direction: column; align-items: center;
        background: rgba(255,255,255,.15);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,.2);
        border-radius: var(--radius-md);
        padding: 10px 18px; min-width: 80px;
      }
      .stat-num { font-size: 24px; font-weight: 800; line-height: 1.2; }
      .stat-label { font-size: 11px; opacity: 0.8; margin-top: 2px; }

      /* ========= LAYOUT ========= */
      .main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 24px 48px;
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 24px;
        align-items: start;
      }

      /* ========= TIMELINE ========= */
      .timeline {
        position: sticky;
        top: 24px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 16px 12px;
        box-shadow: var(--shadow-sm);
      }
      .timeline-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: .8px;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--card-border);
      }
      .timeline-list { list-style: none; position: relative; }
      .timeline-list::before {
        content: '';
        position: absolute;
        left: 8px; top: 4px; bottom: 4px;
        width: 2px;
        background: linear-gradient(to bottom, var(--timeline-dot), var(--card-border));
        border-radius: 2px;
      }
      .timeline-item {
        position: relative;
        padding: 5px 0 5px 22px;
        cursor: pointer;
        border-radius: 6px;
        transition: background .15s;
      }
      .timeline-item:hover { background: var(--accent-light); }
      .timeline-item.active { background: var(--accent-light); }
      .timeline-item::before {
        content: '';
        position: absolute;
        left: 4px; top: 50%;
        transform: translateY(-50%);
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--card-bg);
        border: 2px solid var(--card-border);
        transition: border-color .15s, background .15s;
      }
      .timeline-item:hover::before,
      .timeline-item.active::before {
        border-color: var(--timeline-dot);
        background: var(--timeline-dot);
      }
      .timeline-date { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
      .timeline-count { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

      /* ========= PAPER LIST ========= */
      .papers-section { display: flex; flex-direction: column; gap: 0; }
      .date-group { margin-bottom: 32px; }
      .date-anchor { display: block; height: 1px; margin-top: -90px; padding-top: 90px; pointer-events: none; }
      .date-header {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--card-border);
      }
      .date-pill {
        background: var(--accent);
        color: white;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 12px;
        border-radius: 100px;
      }
      .date-weekday { font-size: 12px; color: var(--text-muted); }
      .date-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }

      .papers-stack { display: flex; flex-direction: column; gap: 12px; }

      /* ========= PAPER CARD ========= */
      .paper-card {
        position: relative;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 20px 20px 16px;
        box-shadow: 0 1px 3px rgba(0,0,0,.06);
        transition: var(--transition);
        display: flex; flex-direction: column;
        opacity: 0;
        transform: translateY(18px);
      }
      .paper-card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .paper-card:hover {
        box-shadow: 0 4px 12px rgba(0,0,0,.07);
        transform: translateY(-2px);
      }
      .paper-card.visible:hover {
        transform: translateY(-2px);
      }
      .paper-card.selected-card {
        border-left: 3px solid var(--accent);
      }

      .card-header {
        display: flex; align-items: flex-start; gap: 10px;
        margin-bottom: 10px;
      }
      .card-num {
        position: absolute; top: -10px; left: 14px;
        background: var(--accent); color: #fff;
        font-size: 11px; font-weight: 700;
        width: 24px; height: 24px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 2px 6px rgba(255,107,53,.35);
        flex-shrink: 0;
      }
      .selected-card .card-num {
        background: var(--accent-dark);
        box-shadow: 0 2px 8px rgba(255,107,53,.5);
      }

      .card-title-wrap { flex: 1; min-width: 0; margin-top: 6px; }
      .card-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.5;
        text-decoration: none;
        display: block;
      }
      .card-title:hover { color: var(--accent); }

      .card-meta {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        margin-top: 6px;
      }
      .badge {
        display: inline-block;
        font-size: 11px; font-weight: 600;
        padding: 3px 10px; border-radius: 100px;
        white-space: nowrap;
        max-width: 160px;
        overflow: hidden; text-overflow: ellipsis;
      }
      .rel-time {
        font-size: 11px;
        color: var(--text-muted);
      }
      .score-dot {
        margin-left: auto;
        font-size: 11px;
        color: var(--text-muted);
        display: flex; align-items: center; gap: 3px;
      }
      .score-star { color: #F6C90E; }

      .card-summary {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.65;
        margin-bottom: 14px;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card-footer {
        display: flex; align-items: center; justify-content: flex-end;
        margin-top: auto;
        padding-top: 10px;
        border-top: 1px solid var(--card-border);
      }
      .read-link {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 13px; font-weight: 600;
        color: var(--accent);
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 100px;
        background: var(--accent-light);
        transition: var(--transition);
      }
      .read-link:hover {
        background: rgba(255,107,53,.16);
        color: var(--accent-dark);
      }
      .read-link svg { width: 14px; height: 14px; }

      /* ========= SEARCH BAR ========= */
      .search-bar {
        grid-column: 1 / -1;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-md);
        padding: 10px 16px;
        box-shadow: var(--shadow-sm);
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 4px;
      }
      .search-input {
        border: none; outline: none;
        width: 100%;
        font-size: 14px;
        color: var(--text);
        background: transparent;
      }
      .search-input::placeholder { color: var(--text-muted); }
      .search-icon { color: var(--text-muted); flex-shrink: 0; }
      .search-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

      /* ========= FOOTER ========= */
      .footer {
        text-align: center;
        padding: 32px 16px 40px;
        border-top: 1px solid var(--card-border);
        color: var(--text-muted);
        font-size: 13px;
        max-width: 1200px; margin: 0 auto;
      }
      .footer a { color: var(--accent); text-decoration: none; }
      .footer a:hover { text-decoration: underline; }

      /* ========= BACK TO TOP ========= */
      .quick-top {
        position: fixed; bottom: 24px; right: 24px;
        width: 44px; height: 44px; border-radius: 50%;
        background: var(--accent); color: #fff;
        border: none; cursor: pointer; font-size: 20px;
        box-shadow: 0 12px 32px rgba(0,0,0,.1);
        opacity: 0; transform: translateY(12px);
        pointer-events: none; transition: var(--transition); z-index: 200;
        display: flex; align-items: center; justify-content: center;
      }
      .quick-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
      .quick-top:hover { background: var(--accent-dark); }

      /* ========= RESPONSIVE ========= */
      @media (max-width: 768px) {
        .header { padding: 32px 16px 28px; }
        .header-stats { gap: 10px; }
        .stat-card { padding: 8px 14px; min-width: 64px; }
        .stat-num { font-size: 20px; }
        .main {
          grid-template-columns: 1fr;
          padding: 16px;
        }
        .timeline { position: static; display: none; }
        .search-bar { grid-column: 1; }
        .card-title { font-size: 14px; }
        .paper-card { padding: 16px 16px 14px; }
      }
    
</style>
</head>

{"idx": 7, "title": "英国AISI与美国CAISI联合评估：月之暗面Kimi K3网络能力显著低于前沿模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "badgeLabel": "Hacker News 热门（buzzi…", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-25T15:38:57.711Z", "dateStr": "2026-07-25", "url": "https://www.nist.gov/news-events/news/2026/07/uk-aisi-caisi-preliminary-assessment-kimi-k3s-cyber-capabilities", "summary": "英国AISI与美国CAISI联合评估了月之暗面7月16日发布的Kimi K3，发现其网络能力显著低于前沿模型。在ExploitBench上Kimi K3得分为32%，高于GLM-5.2的24%，但未能在41个样本中实现任意代码执行，而前沿模型平均完成20/41。在32步模拟企业网络攻击中，Kimi K3平均到达第17步，前沿美国模型平均到达28.5步。", "selected": false, "score": 66},
{"idx": 8, "title": "Agentic Context Management：五部分系统管理AI智能体上下文", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-25T08:29:00.000Z", "dateStr": "2026-07-25", "url": "https://x.com/rohanpaul_ai/status/2080933321198993635", "summary": "论文提出Agentic Context Management，一个五部分系统，用于决定AI智能体应保留、检索、共享、准备和安全压缩哪些上下文。其实现Maximem Synap在LongMemEval上得分92%，在LoCoMo类别1-4上得分93.2%，使token使用量从随对话长度平方增长变为近似线性增长。", "selected": false, "score": 31},
{"idx": 9, "title": "北大团队基于AlphaFold3接触概率开发ContactSeek框架，赋能精准碱基编辑", "source": "IT之家（RSS）", "badgeLabel": "IT之家（RSS）", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-25T05:17:22.000Z", "dateStr": "2026-07-25", "url": "https://www.ithome.com/0/981/478.htm", "summary": "北京大学生命科学学院伊成器课题组联合华东师大团队，在《自然》发表论文，提出基于AlphaFold3接触概率（CP）的AI框架ContactSeek。该框架整合AlphaFold3预测的CP与高通量脱靶编辑数据，系统识别Cas蛋白和脱氨酶中决定编辑特异性的关键氨基酸残基，并据此工程化改造碱基编辑工具。研究鉴定出一系列可提升ABE精准性的全新Cas9变体，在维持高效在靶编辑的同时降低DNA脱靶编辑。", "selected": false, "score": 36},

{"idx": 11, "title": "Agentic Context Management 论文提出五大原语", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-24T22:03:02.000Z", "dateStr": "2026-07-24", "url": "https://x.com/omarsar0/status/2080775791395340313", "summary": "论文指出生产级AI智能体失败更多源于上下文管理而非推理能力，并提出架构、摄取、范围界定、预测和压缩五大原语。其参考实现在LongMemEval和LoCoMo基准上分别达到92%和93.2%的准确率，通过保真度验证的压缩可在线性成本下保留关键信息。", "selected": false, "score": 47},

{"idx": 14, "title": "大型研究：ChatGPT 未显著影响大学成绩", "source": "X：Ethan Mollick (@emollick)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-24T16:16:21.000Z", "dateStr": "2026-07-24", "url": "https://x.com/emollick/status/2080688546839491031", "summary": "一项基于美国某大型大学行政数据的研究发现，ChatGPT 引入后，易受 GenAI 影响的课程（如居家论文）成绩并未出现不成比例的增长，学生课程评价也无显著变化。研究指出，GenAI 并未明显导致学习替代或降低学生满意度，但结果受 COVID 干扰等因素影响，应视为提示性而非结论性。", "selected": false, "score": 47},
{"idx": 15, "title": "Anthropic 联合 Andon Labs 发布 Drone-Bench，评估 AI 模型自主操控无人机执行定位追踪任务的能力", "source": "Anthropic：Research（发表成果 · 网页）", "badgeLabel": "Anthropic", "badgeBg": "#f3e5f5", "badgeColor": "#7b1fa2", "publishedAt": "2026-07-24T15:25:45.300Z", "dateStr": "2026-07-24", "url": "https://www.anthropic.com/research/project-pilot", "summary": "Anthropic 与 Andon Labs 合作推出 Drone-Bench，用于测试 AI 模型自主操控四旋翼无人机在室内环境中定位并追踪指定人员的能力。该基准将任务分解为 3D 地图重建、定位、导航、目标检测与跟随五个子任务，并通过软件复现实现快速评估。实验表明，该任务链的难度足以区分不同智能水平的模型，并揭示 AI 在物理世界操控能力上的进步轨迹。", "selected": true, "score": 73},
{"idx": 16, "title": "面壁智能与清华NLP提出长上下文推理数据配方，无需特殊奖励工程", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-24T13:00:01.000Z", "dateStr": "2026-07-24", "url": "https://x.com/OpenBMB/status/2080639139465015395", "summary": "面壁智能（OpenBMB）联合清华NLP提出，仅靠精心设计的数据配方与极简GRPO即可显著提升长上下文推理，无需特殊奖励工程。该方法将推理分解为检索、多证据合成与推理三种能力，构建8个数据集（约1.4万条样本）训练。在Qwen3-4B/8B/30B-A3B上，七个长上下文基准平均提升+7.2/+3.2/+6.4，效果可泛化至512K+ token。", "selected": false, "score": 58},
{"idx": 17, "title": "Meta 新基准 GAMUT 衡量 AI 回答的事实完整性", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-24T11:44:00.000Z", "dateStr": "2026-07-24", "url": "https://x.com/rohanpaul_ai/status/2080620006526652699", "summary": "Meta 新论文提出，事实性不仅包括避免错误，还需包含足够的关键信息。新基准 GAMUT 通过构建结构化指南，将缺失信息转化为可衡量的 pass/fail 检查。在 14 个强模型测试中，最佳得分仅为 58.7%，信息缺失导致的失败比错误陈述更多。", "selected": false, "score": 35},
{"idx": 18, "title": "PRO-LONG：无损记忆让智能体长程推理提升18%", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-24T10:31:00.000Z", "dateStr": "2026-07-24", "url": "https://x.com/rohanpaul_ai/status/2080601635739365465", "summary": "PRO-LONG方法通过将所有历史动作、观察和结果记录在可搜索的结构化文本日志中，而非丢弃信息，使AI智能体在长周期任务中推理更可靠。在ARC-AGI-3的25个隐藏规则游戏中，该方法让相同基础智能体平均提升18个百分点，同时比更强的专用系统节省4.2至5.8倍的计费token。论文表明，长期智能体记忆的最佳方案可能是无损存储加可编程检索。", "selected": false, "score": 37},
{"idx": 19, "title": "小红书等提出 UniNote：统一多模态嵌入模型", "source": "公众号：小红书技术（dots.llm）", "badgeLabel": "公众号", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-24T10:00:00.000Z", "dateStr": "2026-07-24", "url": "https://mp.weixin.qq.com/s/YFyKzcFo67rK3rvADvG4gg", "summary": "小红书、上海交通大学、华中科技大学和北京理工大学联合提出 UniNote，将多模态表示学习与排序能力融合于单一模型。通过两阶段训练（对比 SFT 强化表示 + 强化学习排序优化），UniNote 在单次嵌入传递中实现与两阶段检索-排序范式相当的性能，并大幅降低延迟。", "selected": false, "score": 49},
{"idx": 20, "title": "长上下文智能体：渐进式披露并非万能", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-24T07:56:00.000Z", "dateStr": "2026-07-24", "url": "https://x.com/rohanpaul_ai/status/2080562628431352264", "summary": "一项新研究对比了原始导航、扁平技能与深层技能层级在长上下文智能体中的效果。在单本书场景下，强智能体本身搜索能力已足够，扁平技能几乎无准确率提升；但在20本书的大型知识库中，扁平技能将英文开放问题准确率从0.257提升至0.462。研究表明，技能索引并非让模型更聪明，而是在语料库过大时帮助节省上下文，且单层路由在大规模文档库中比深层层级更有效。", "selected": false, "score": 37},
{"idx": 21, "title": "Harness Handbook：让智能体框架代码可读、可导航、可编辑", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-24T06:48:41.000Z", "dateStr": "2026-07-24", "url": "https://x.com/rohanpaul_ai/status/2080545686919987619", "summary": "Harness Handbook 将代码仓库按运行时行为重新组织，并链接已验证的源码位置，帮助编码智能体找到更多需修改的代码位置，同时减少规划 token 使用量。在 Codex 和 Terminus-2 请求上，该方法将计划成功率分别提升 10.0 和 18.9 个百分点，同时 token 消耗降低 12.7% 和 8.6%。", "selected": false, "score": 37},
{"idx": 22, "title": "多智能体系统何时有效？信息瓶颈视角", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-24T01:16:04.000Z", "dateStr": "2026-07-24", "url": "https://x.com/rohanpaul_ai/status/2080461981430198438", "summary": "一项研究从信息瓶颈视角揭示，多智能体系统并非越多越好，其价值在于为每个智能体提供更干净、更小的上下文。在18项测试中，当智能体间传递的摘要信息紧凑且完整时，多智能体系统持续优于单智能体，尤其对上下文拥挤时表现较弱的模型帮助显著。但当后续步骤需要精确的早期细节时，优势会缩小甚至逆转，因为更强的模型利用完整上下文的效果优于压缩后的信息。", "selected": false, "score": 35},
{"idx": 23, "title": "Apple 提出 LEAD 方法，破解长程推理中的\"不可恢复瓶颈\"", "source": "Apple Machine Learning Research（RSS）", "badgeLabel": "Apple Machine Learni…", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-24T00:00:00.000Z", "dateStr": "2026-07-24", "url": "https://machinelearning.apple.com/research/lead-no-recovery-bottleneck", "summary": "Apple 研究发现，大语言模型在长程执行中即使有高层策略也不稳定，极端分解会导致\"不可恢复瓶颈\"--少数\"困难\"步骤上的持续错误变得不可逆转。为此提出 Lookahead-Enhanced Atomic Decomposition（LEAD），通过引入短程未来验证与聚合来打破这一瓶颈。该方法在受控算法谜题上验证了有效性。", "selected": false, "score": 51},
{"idx": 24, "title": "我国科学家实现植物免疫受体精准定制化设计，成果登上《科学》", "source": "IT之家（RSS）", "badgeLabel": "IT之家（RSS）", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-23T23:10:44.000Z", "dateStr": "2026-07-23", "url": "https://www.ithome.com/0/980/885.htm", "summary": "中国科学院遗传与发育生物学研究所高彩霞团队首次提出\"可编程植物合成免疫\"新理念，并建立合成植物免疫受体设计平台。团队利用AlphaFold 3和BindCraft等AI工具，针对13种植物病毒及细菌、真菌等病原蛋白设计391个合成受体，其中71个（成功率18.2%）能特异识别靶标并激活免疫反应。经植物体内定向进化系统（GRAPE）优化的合成受体在转基因本氏烟草中展现了对番茄褐色皱果病毒的有效抗性。", "selected": false, "score": 39},
{"idx": 25, "title": "NaceAI 超网络知识注入：不改大模型参数也能学新知识", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-23T21:27:44.000Z", "dateStr": "2026-07-23", "url": "https://x.com/rohanpaul_ai/status/2080404518957895722", "summary": "NaceAI 研究提出一种超网络方法，让一个模型学习为另一个模型生成知识更新，无需修改基础模型的数十亿参数。该方法通过添加低秩矩阵来注入新知识，并重定向模型内部计算，将知识注入变为可复用流程。实验表明，目标模型越大，生成的更新泛化效果越好。", "selected": false, "score": 36},

<script>
(function(){
  var WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  function relativeTime(isoStr){
    var now = Date.now();
    var t = new Date(isoStr).getTime();
    var diff = Math.floor((now - t) / 1000);
    if(diff < 60) return '刚刚';
    if(diff < 3600) return Math.floor(diff/60) + ' 分钟前';
    if(diff < 86400) return Math.floor(diff/3600) + ' 小时前';
    if(diff < 604800) return Math.floor(diff/86400) + ' 天前';
    return new Date(isoStr).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
  }

  function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

  function buildTimeline(){
    var list = document.getElementById('timelineList');
    if(!list) return;
    list.innerHTML = '';
    window.TIMELINE_DATA.forEach(function(g){
      var li = document.createElement('li');
      li.className = 'timeline-item';
      li.dataset.date = g.date;
      li.innerHTML = '<div class="timeline-date">' + g.date.slice(5) + '</div>'
        + '<div class="timeline-count">' + g.wd + ' · ' + g.count + ' 篇</div>';
      li.addEventListener('click', function(){
        var el = document.getElementById('anchor-' + g.date);
        if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      });
      list.appendChild(li);
    });
  }

  function buildCards(filtered){
    var section = document.getElementById('papersSection');
    if(!section) return;
    section.innerHTML = '';

    var groups = {};
    filtered.forEach(function(p){
      if(!groups[p.dateStr]) groups[p.dateStr] = [];
      groups[p.dateStr].push(p);
    });
    var sortedDates = Object.keys(groups).sort(function(a,b){ return b.localeCompare(a); });

    var timelineGroups = sortedDates.map(function(d){
      return {date:d, wd:WEEKDAYS[new Date(d+'T00:00:00+08:00').getDay()], count:groups[d].length};
    });
    window.TIMELINE_DATA = timelineGroups;
    buildTimeline();

    sortedDates.forEach(function(date){
      var grp = groups[date];
      var d = new Date(date + 'T00:00:00+08:00');
      var wd = WEEKDAYS[d.getDay()];
      var groupEl = document.createElement('div');
      groupEl.className = 'date-group';
      var anchor = document.createElement('div');
      anchor.className = 'date-anchor';
      anchor.id = 'anchor-' + date;
      groupEl.appendChild(anchor);
      var header = document.createElement('div');
      header.className = 'date-header';
      header.innerHTML = '<span class="date-pill">' + date + '</span>'
        + '<span class="date-weekday">' + wd + '</span>'
        + '<span class="date-count">' + grp.length + ' 篇</span>';
      groupEl.appendChild(header);
      var stack = document.createElement('div');
      stack.className = 'papers-stack';

      grp.forEach(function(p){
        var card = document.createElement('div');
        card.className = 'paper-card' + (p.selected ? ' selected-card' : '');
        card.dataset.id = p.idx;
        var shtml = '';
        if(p.summary && p.summary !== '暂无摘要'){
          shtml = '<div class="card-summary">' + escHtml(p.summary) + '</div>';
        }
        card.innerHTML =
          '<div class="card-header">' +
            '<div class="card-num">' + p.idx + '</div>' +
            '<div class="card-title-wrap">' +
              '<a class="card-title" href="' + escAttr(p.url) + '" target="_blank" rel="noopener">' + escHtml(p.title) + '</a>' +
              '<div class="card-meta">' +
                '<span class="badge" style="background:' + escAttr(p.badgeBg) + ';color:' + escAttr(p.badgeColor) + '" title="' + escAttr(p.source) + '">' + escHtml(p.badgeLabel) + '</span>' +
                '<span class="rel-time">' + relativeTime(p.publishedAt) + '</span>' +
                '<span class="score-dot"><span class="score-star">\u2605</span>' + p.score + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          shtml +
          '<div class="card-footer">' +
            '<a class="read-link" href="' + escAttr(p.url) + '" target="_blank" rel="noopener">' +
              '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\" fill=\"currentColor\"><path d=\"M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5z\"/><path d=\"M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0v-5z\"/></svg>' + ' 阅读原文</a>' +
          '</div>';
        stack.appendChild(card);
      });
      groupEl.appendChild(stack);
      section.appendChild(groupEl);
    });

    document.getElementById('filtered-count').textContent = filtered.length;

    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add('visible'); observer.unobserve(e.target); }
      });
    }, {threshold:0.08, rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.paper-card').forEach(function(el){ observer.observe(el); });

    highlightTimeline();
  }

  function highlightTimeline(){
    var groups = document.querySelectorAll('.date-group');
    var tItems = document.querySelectorAll('.timeline-item');
    var scrollY = window.scrollY + 160;
    var activeDate = null;
    groups.forEach(function(g){
      var anchor = g.querySelector('.date-anchor');
      if(anchor && anchor.getBoundingClientRect().top + window.scrollY <= scrollY){
        activeDate = g.querySelector('.date-anchor').id.replace('anchor-','');
      }
    });
    tItems.forEach(function(item){
      item.classList.toggle('active', item.dataset.date === activeDate);
    });
  }

  window.addEventListener('scroll', highlightTimeline, {passive:true});

  var searchInput = document.getElementById('searchInput');
  var searchCount = document.getElementById('searchCount');
  var debounceTimer;
  if(searchInput){
    searchInput.addEventListener('input', function(){
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function(){
        var q = searchInput.value.trim().toLowerCase();
        var filtered;
        if(!q){ filtered = window.PAPERS; }
        else { filtered = window.PAPERS.filter(function(p){
          return (p.title && p.title.toLowerCase().indexOf(q)!==-1)
              || (p.summary && p.summary.toLowerCase().indexOf(q)!==-1)
              || (p.source && p.source.toLowerCase().indexOf(q)!==-1)
              || (p.badgeLabel && p.badgeLabel.toLowerCase().indexOf(q)!==-1);
        }); }
        searchCount.textContent = filtered.length + ' 篇';
        buildCards(filtered);
      }, 250);
    });
  }

  buildCards(window.PAPERS);
  buildTimeline();

  /* ---- back to top ---- */
  var qtop = document.getElementById('quickTop');
  window.addEventListener('scroll', function(){
    qtop.classList.toggle('visible', window.scrollY > 400);
  });
})();

</script>

<div class="quick-top" id="quickTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
