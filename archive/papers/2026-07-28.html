<style>
    :root {

        --hero-mid: #f73b4a;
        --hero-to: #c0392b;
        --accent: #ff6b35;
        --accent-dark: #e0552b;
        --accent-light: rgba(255,107,53,.08);
        --bg: #faf8f6;
        --card-bg: #ffffff;
        --card-border: #ede8e2;
        --text: #2c2c2c;
        --text-secondary: #6b6b6b;
        --text-muted: #999999;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
        --shadow-md: 0 4px 12px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
        --shadow-lg: 0 12px 32px rgba(0,0,0,.1), 0 4px 8px rgba(0,0,0,.05);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --timeline-dot: #ff6b35;
        --timeline-line: #ede8e2;
        --timeline-active-bg: rgba(255,107,53,.06);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
      }

      /* ========= HEADER (matching daily hero) ========= */
      .header {
        position: relative; overflow: hidden;
        background: linear-gradient(135deg, var(--hero-from) 0%, var(--hero-mid) 40%, var(--hero-to) 100%);
        color: #fff;
        padding: 40px 24px 36px;
        text-align: center;
        z-index: 100;
        box-shadow: 0 4px 20px rgba(0,0,0,.15);
      }
      .header::before {
        content: '';
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 70% 30%, rgba(255,255,255,.15) 0%, transparent 60%),
                    radial-gradient(ellipse at 20% 80%, rgba(255,200,120,.12) 0%, transparent 50%);
      }
      .header-inner {
        position: relative; z-index: 1;
        max-width: 720px; margin: 0 auto;
        display: flex; flex-direction: column; align-items: center; gap: 16px;
      }
      .header-badge {
        display: inline-block;
        background: rgba(255,255,255,.2);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 100px;
        padding: 4px 16px;
        font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
      }
      .header-title {
        font-size: clamp(22px, 4vw, 32px);
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .header-sub {
        font-size: 14px;
        opacity: 0.85;
      }
      .header-stats {
        display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
      }
      .stat-card {
        display: flex; flex-direction: column; align-items: center;
        background: rgba(255,255,255,.15);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,.2);
        border-radius: var(--radius-md);
        padding: 10px 18px; min-width: 80px;
      }
      .stat-num { font-size: 24px; font-weight: 800; line-height: 1.2; }
      .stat-label { font-size: 11px; opacity: 0.8; margin-top: 2px; }

      /* ========= LAYOUT ========= */
      .main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 24px 48px;
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 24px;
        align-items: start;
      }

      /* ========= TIMELINE ========= */
      .timeline {
        position: sticky;
        top: 24px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 16px 12px;
        box-shadow: var(--shadow-sm);
      }
      .timeline-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: .8px;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--card-border);
      }
      .timeline-list { list-style: none; position: relative; }
      .timeline-list::before {
        content: '';
        position: absolute;
        left: 8px; top: 4px; bottom: 4px;
        width: 2px;
        background: linear-gradient(to bottom, var(--timeline-dot), var(--card-border));
        border-radius: 2px;
      }
      .timeline-item {
        position: relative;
        padding: 5px 0 5px 22px;
        cursor: pointer;
        border-radius: 6px;
        transition: background .15s;
      }
      .timeline-item:hover { background: var(--accent-light); }
      .timeline-item.active { background: var(--accent-light); }
      .timeline-item::before {
        content: '';
        position: absolute;
        left: 4px; top: 50%;
        transform: translateY(-50%);
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--card-bg);
        border: 2px solid var(--card-border);
        transition: border-color .15s, background .15s;
      }
      .timeline-item:hover::before,
      .timeline-item.active::before {
        border-color: var(--timeline-dot);
        background: var(--timeline-dot);
      }
      .timeline-date { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
      .timeline-count { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

      /* ========= PAPER LIST ========= */
      .papers-section { display: flex; flex-direction: column; gap: 0; }
      .date-group { margin-bottom: 32px; }
      .date-anchor { display: block; height: 1px; margin-top: -90px; padding-top: 90px; pointer-events: none; }
      .date-header {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--card-border);
      }
      .date-pill {
        background: var(--accent);
        color: white;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 12px;
        border-radius: 100px;
      }
      .date-weekday { font-size: 12px; color: var(--text-muted); }
      .date-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }

      .papers-stack { display: flex; flex-direction: column; gap: 12px; }

      /* ========= PAPER CARD ========= */
      .paper-card {
        position: relative;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 20px 20px 16px;
        box-shadow: 0 1px 3px rgba(0,0,0,.06);
        transition: var(--transition);
        display: flex; flex-direction: column;
        opacity: 0;
        transform: translateY(18px);
      }
      .paper-card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .paper-card:hover {
        box-shadow: 0 4px 12px rgba(0,0,0,.07);
        transform: translateY(-2px);
      }
      .paper-card.visible:hover {
        transform: translateY(-2px);
      }
      .paper-card.selected-card {
        border-left: 3px solid var(--accent);
      }

      .card-header {
        display: flex; align-items: flex-start; gap: 10px;
        margin-bottom: 10px;
      }
      .card-num {
        position: absolute; top: -10px; left: 14px;
        background: var(--accent); color: #fff;
        font-size: 11px; font-weight: 700;
        width: 24px; height: 24px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 2px 6px rgba(255,107,53,.35);
        flex-shrink: 0;
      }
      .selected-card .card-num {
        background: var(--accent-dark);
        box-shadow: 0 2px 8px rgba(255,107,53,.5);
      }

      .card-title-wrap { flex: 1; min-width: 0; margin-top: 6px; }
      .card-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.5;
        text-decoration: none;
        display: block;
      }
      .card-title:hover { color: var(--accent); }

      .card-meta {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        margin-top: 6px;
      }
      .badge {
        display: inline-block;
        font-size: 11px; font-weight: 600;
        padding: 3px 10px; border-radius: 100px;
        white-space: nowrap;
        max-width: 160px;
        overflow: hidden; text-overflow: ellipsis;
      }
      .rel-time {
        font-size: 11px;
        color: var(--text-muted);
      }
      .score-dot {
        margin-left: auto;
        font-size: 11px;
        color: var(--text-muted);
        display: flex; align-items: center; gap: 3px;
      }
      .score-star { color: #F6C90E; }

      .card-summary {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.65;
        margin-bottom: 14px;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card-footer {
        display: flex; align-items: center; justify-content: flex-end;
        margin-top: auto;
        padding-top: 10px;
        border-top: 1px solid var(--card-border);
      }
      .read-link {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 13px; font-weight: 600;
        color: var(--accent);
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 100px;
        background: var(--accent-light);
        transition: var(--transition);
      }
      .read-link:hover {
        background: rgba(255,107,53,.16);
        color: var(--accent-dark);
      }
      .read-link svg { width: 14px; height: 14px; }

      .search-bar {
        grid-column: 1 / -1;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-md);
        padding: 10px 16px;
        box-shadow: var(--shadow-sm);
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 4px;
      }
      .search-input {
        border: none; outline: none;
        width: 100%;
        font-size: 14px;
        color: var(--text);
        background: transparent;
      }
      .search-input::placeholder { color: var(--text-muted); }
      .search-icon { color: var(--text-muted); flex-shrink: 0; }
      .search-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

      /* ========= FOOTER ========= */
      .footer {
        text-align: center;
        padding: 32px 16px 40px;
        border-top: 1px solid var(--card-border);
        color: var(--text-muted);
        font-size: 13px;
        max-width: 1200px; margin: 0 auto;
      }
      .footer a { color: var(--accent); text-decoration: none; }
      .footer a:hover { text-decoration: underline; }

      /* ========= BACK TO TOP ========= */
      .quick-top {
        position: fixed; bottom: 24px; right: 24px;
        width: 44px; height: 44px; border-radius: 50%;
        background: var(--accent); color: #fff;
        border: none; cursor: pointer; font-size: 20px;
        box-shadow: 0 12px 32px rgba(0,0,0,.1);
        opacity: 0; transform: translateY(12px);
        pointer-events: none; transition: var(--transition); z-index: 200;
        display: flex; align-items: center; justify-content: center;
      }
      .quick-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
      .quick-top:hover { background: var(--accent-dark); }

      /* ========= RESPONSIVE ========= */
      @media (max-width: 768px) {
        .header { padding: 32px 16px 28px; }
        .header-stats { gap: 10px; }
        .stat-card { padding: 8px 14px; min-width: 64px; }
        .stat-num { font-size: 20px; }
        .main {
          grid-template-columns: 1fr;
          padding: 16px;
        }
        .timeline { position: static; display: none; }
        .search-bar { grid-column: 1; }
        .card-title { font-size: 14px; }
        .paper-card { padding: 16px 16px 14px; }
      }
    
</style>
</head>

{"idx": 7, "title": "2D-RoPE让模型复制长文本更精准", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-27T05:10:06.000Z", "dateStr": "2026-07-27", "url": "https://x.com/rohanpaul_ai/status/2081608042794356994", "summary": "前沿大语言模型在解决高级推理任务时，仍无法精确复制长重复字符串，且输入越长或重复模式越多，复制越不可靠。研究发现，标准1D RoPE位置编码是部分原因，而2D-RoPE将源文本与输出视为独立行，使对应token对齐在同一列。在合成测试中，仅训练长度1-100的单层模型在长达1000倍的输入上完美复制，该优势在1.4B参数预训练模型上同样出现，但当前设计仍依赖换行符，非通用解决方案。", "selected": false, "score": 35},
{"idx": 8, "title": "OpenAI 研究：ChatGPT 正扩展员工工作边界，跨角色任务增加", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "badgeLabel": "OpenAI", "badgeBg": "#e8f5e9", "badgeColor": "#2e7d32", "publishedAt": "2026-07-27T03:30:00.000Z", "dateStr": "2026-07-27", "url": "https://openai.com/index/how-ai-is-expanding-what-people-do-at-work", "summary": "OpenAI 最新研究显示，ChatGPT 用户正在跨角色承担更多任务，AI 正在重塑工作边界。研究发现，AI 并非简单替代岗位，而是帮助员工扩展技能范围，从事原本不属于其职责的工作。这一趋势表明，AI 工具正在推动职业边界的模糊化与工作内容的多样化。", "selected": false, "score": 35},
{"idx": 9, "title": "AI 代码审查提速但牺牲多样性", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-27T02:42:50.000Z", "dateStr": "2026-07-27", "url": "https://x.com/rohanpaul_ai/status/2081570981613867100", "summary": "一项对 207 个 GitHub 项目、102 万次拉取请求的研究发现，采用 AI 智能体审查的项目，每千行代码（KLOC）的审查时间缩短了 2.5 至 4.5 天。但早期大量使用 LLM 审查的项目未见显著效率提升。AI 审查模式在 78%-94% 的拉取请求中存在\"审查异味\"，高于人工审查的 69%-76%，主要原因是重复分配同一 AI 审查者身份导致多样性下降。", "selected": false, "score": 36},
{"idx": 10, "title": "Apple 提出 GH-ESD：面向实例级视觉任务的假设驱动错误切片发现方法", "source": "Apple Machine Learning Research（RSS）", "badgeLabel": "Apple Machine Learni…", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-27T00:00:00.000Z", "dateStr": "2026-07-27", "url": "https://machinelearning.apple.com/research/gh-esd", "summary": "Apple 机器学习研究团队提出 GH-ESD（Grounded Hypothesis-Driven Error Slice Discovery），一种针对目标检测与分割等实例级视觉任务的错误切片发现方法。现有方法主要适用于图像级分类，难以捕捉由上下文关系和空间视觉模式导致的实例级失败。GH-ESD 通过基于假设的驱动方式，系统性地发现模型在语义连贯子集上的系统性失效。", "selected": false, "score": 40},
{"idx": 11, "title": "NVIDIA 研究：AdamW 存在规模天花板，SOAP/Muon 更优", "source": "X：Elvis Saravia (@omarsar0, DAIR.AI)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-26T20:09:01.000Z", "dateStr": "2026-07-26", "url": "https://x.com/omarsar0/status/2081471875885203791", "summary": "NVIDIA 新研究指出，在高达 1 亿 token 的批大小下，AdamW 优化器训练稳定性下降，而 SOAP 和 Muon 能保持稳定。团队通过每步 QR 正交化消除了 SOAP 在大批大小下的损失尖峰，并在数万亿 token 训练的多十亿参数模型上验证了两种优化器持续优于 AdamW。他们还提出了与 Megatron-LM 兼容的逐层分布式优化器，在不牺牲收敛收益的前提下平衡内存与通信。", "selected": false, "score": 48},
{"idx": 12, "title": "智能体记忆中的提示注入攻击研究", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-26T15:15:00.000Z", "dateStr": "2026-07-26", "url": "https://x.com/rohanpaul_ai/status/2081397882561642595", "summary": "华盛顿大学研究发现，当AI智能体在记忆文件中遭遇恶意指令时，存在两个独立问题：是否执行指令（Opus模型大多拒绝）以及是否移除该指令（通常不会）。研究团队将恶意载荷注入CLAUDE.md等持久化工作区文件，对claude-code和codex在4个模型上进行了多会话探测。由于记忆文件每会话从头加载，一次拒绝仅对当前会话有效，恶意指令会在下一会话继续生效。", "selected": false, "score": 47},
{"idx": 13, "title": "预训练验证损失可预测强化学习收益：基于国际象棋任务的LLM流水线研究", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-26T14:28:00.000Z", "dateStr": "2026-07-26", "url": "https://x.com/rohanpaul_ai/status/2081386054787965166", "summary": "研究发现，预训练验证损失能高精度预测RL后的pass@1准确率（相关性|ρ|从0.93提升至0.99），且每10倍RL算力的奖励增益与预训练token数对数正相关（r=+0.84）。在680M参数下，RL最优算力占比约28%。机制上，RL并非均匀增强推理，而是对困难问题生成正确动作的同时，数倍放大已偏好的错误动作，因此仅提升pass@1而非pass@16。", "selected": false, "score": 36},
{"idx": 14, "title": "BabelTele：压缩文本至27.9%仍保留99.5%语义", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-26T13:19:00.000Z", "dateStr": "2026-07-26", "url": "https://x.com/rohanpaul_ai/status/2081368689828635090", "summary": "新研究提出BabelTele压缩写作风格，通过混合缩写、符号和多语言片段生成模型可读的密集信息，替代人类自然语言。实验显示，BabelTele将文本压缩至原长27.9%，同时保持约99.5%的语义保真度。研究表明，人类可读性与机器可恢复性是可分离的，未来AI智能体间通信或无需完整自然语言。", "selected": false, "score": 36},
{"idx": 15, "title": "就业形势如何？区分人工智能的炒作与现实", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "badgeLabel": "Hacker News 热门（buzzi…", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-26T11:06:49.887Z", "dateStr": "2026-07-26", "url": "https://siepr.stanford.edu/publications/policy-brief/what-really-happening-jobs-separating-ai-hype-reality", "summary": "目前几乎没有证据表明AI正在导致大规模失业，AI高暴露职业的失业率上升幅度（0.77个百分点）甚至低于低暴露职业（0.85个百分点）。AI对工人生产率的影响喜忧参半但总体积极，企业采用速度加快但分布不均。早期职业人群（如软件开发者）在AI暴露岗位上的就业自ChatGPT发布后出现明显下降，被研究者比作\"煤矿中的金丝雀\"。", "selected": false, "score": 48},

{"idx": 17, "title": "ABBEL：通过信念瓶颈提升LLM长程交互中的摘要学习效率", "source": "BAIR：Berkeley AI Research Blog", "badgeLabel": "BAIR", "badgeBg": "#e8eaf6", "badgeColor": "#283593", "publishedAt": "2026-07-26T09:00:00.000Z", "dateStr": "2026-07-26", "url": "http://bair.berkeley.edu/blog/2026/07/26/abbel", "summary": "BAIR提出ABBEL框架，将长程交互中的摘要生成隔离为自然语言信念状态，并通过信念评分进行监督。在CollabBench协作编程测试中，基于重建的信念评分将全上下文模型的性能差距缩小约50%，训练步数减少50%。该方法解决了递归摘要（如Cursor Composer 2.5采用的压缩技术）在有限训练数据下性能下降的问题。", "selected": false, "score": 51},

{"idx": 19, "title": "Agentic Context Management：五部分系统管理AI智能体上下文", "source": "X：Rohan Paul (@rohanpaul_ai)", "badgeLabel": "X", "badgeBg": "#f0f0f0", "badgeColor": "#555555", "publishedAt": "2026-07-25T08:29:00.000Z", "dateStr": "2026-07-25", "url": "https://x.com/rohanpaul_ai/status/2080933321198993635", "summary": "论文提出Agentic Context Management，一个五部分系统，用于决定AI智能体应保留、检索、共享、准备和安全压缩哪些上下文。其实现Maximem Synap在LongMemEval上得分92%，在LoCoMo类别1-4上得分93.2%，使token使用量从随对话长度平方增长变为近似线性增长。", "selected": false, "score": 31},

<script>
(function(){
  var WEEKDAYS = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  function relativeTime(isoStr){
    var now = Date.now();
    var t = new Date(isoStr).getTime();
    var diff = Math.floor((now - t) / 1000);
    if(diff < 60) return '刚刚';
    if(diff < 3600) return Math.floor(diff/60) + ' 分钟前';
    if(diff < 86400) return Math.floor(diff/3600) + ' 小时前';
    if(diff < 604800) return Math.floor(diff/86400) + ' 天前';
    return new Date(isoStr).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
  }

  function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

  function buildTimeline(){
    var list = document.getElementById('timelineList');
    if(!list) return;
    list.innerHTML = '';
    window.TIMELINE_DATA.forEach(function(g){
      var li = document.createElement('li');
      li.className = 'timeline-item';
      li.dataset.date = g.date;
      li.innerHTML = '<div class="timeline-date">' + g.date.slice(5) + '</div>'
        + '<div class="timeline-count">' + g.wd + ' · ' + g.count + ' 篇</div>';
      li.addEventListener('click', function(){
        var el = document.getElementById('anchor-' + g.date);
        if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      });
      list.appendChild(li);
    });
  }

  function buildCards(filtered){
    var section = document.getElementById('papersSection');
    if(!section) return;
    section.innerHTML = '';

    var groups = {};
    filtered.forEach(function(p){
      if(!groups[p.dateStr]) groups[p.dateStr] = [];
      groups[p.dateStr].push(p);
    });
    var sortedDates = Object.keys(groups).sort(function(a,b){ return b.localeCompare(a); });

    var timelineGroups = sortedDates.map(function(d){
      return {date:d, wd:WEEKDAYS[new Date(d+'T00:00:00+08:00').getDay()], count:groups[d].length};
    });
    window.TIMELINE_DATA = timelineGroups;
    buildTimeline();

    sortedDates.forEach(function(date){
      var grp = groups[date];
      var d = new Date(date + 'T00:00:00+08:00');
      var wd = WEEKDAYS[d.getDay()];
      var groupEl = document.createElement('div');
      groupEl.className = 'date-group';
      var anchor = document.createElement('div');
      anchor.className = 'date-anchor';
      anchor.id = 'anchor-' + date;
      groupEl.appendChild(anchor);
      var header = document.createElement('div');
      header.className = 'date-header';
      header.innerHTML = '<span class="date-pill">' + date + '</span>'
        + '<span class="date-weekday">' + wd + '</span>'
        + '<span class="date-count">' + grp.length + ' 篇</span>';
      groupEl.appendChild(header);
      var stack = document.createElement('div');
      stack.className = 'papers-stack';

      grp.forEach(function(p){
        var card = document.createElement('div');
        card.className = 'paper-card' + (p.selected ? ' selected-card' : '');
        card.dataset.id = p.idx;
        var shtml = '';
        if(p.summary && p.summary !== '暂无摘要'){
          shtml = '<div class="card-summary">' + escHtml(p.summary) + '</div>';
        }
        card.innerHTML =
          '<div class="card-header">' +
            '<div class="card-num">' + p.idx + '</div>' +
            '<div class="card-title-wrap">' +
              '<a class="card-title" href="' + escAttr(p.url) + '" target="_blank" rel="noopener">' + escHtml(p.title) + '</a>' +
              '<div class="card-meta">' +
                '<span class="badge" style="background:' + escAttr(p.badgeBg) + ';color:' + escAttr(p.badgeColor) + '" title="' + escAttr(p.source) + '">' + escHtml(p.badgeLabel) + '</span>' +
                '<span class="rel-time">' + relativeTime(p.publishedAt) + '</span>' +
                '<span class="score-dot"><span class="score-star">\u2605</span>' + p.score + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          shtml +
          '<div class="card-footer">' +
            '<a class="read-link" href="' + escAttr(p.url) + '" target="_blank" rel="noopener">' +
              '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\" fill=\"currentColor\"><path d=\"M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5z\"/><path d=\"M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0v-5z\"/></svg>' + ' 阅读原文</a>' +
          '</div>';
        stack.appendChild(card);
      });
      groupEl.appendChild(stack);
      section.appendChild(groupEl);
    });

    document.getElementById('filtered-count').textContent = filtered.length;

    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add('visible'); observer.unobserve(e.target); }
      });
    }, {threshold:0.08, rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.paper-card').forEach(function(el){ observer.observe(el); });

    highlightTimeline();
  }

  function highlightTimeline(){
    var groups = document.querySelectorAll('.date-group');
    var tItems = document.querySelectorAll('.timeline-item');
    var scrollY = window.scrollY + 160;
    var activeDate = null;
    groups.forEach(function(g){
      var anchor = g.querySelector('.date-anchor');
      if(anchor && anchor.getBoundingClientRect().top + window.scrollY <= scrollY){
        activeDate = g.querySelector('.date-anchor').id.replace('anchor-','');
      }
    });
    tItems.forEach(function(item){
      item.classList.toggle('active', item.dataset.date === activeDate);
    });
  }

  window.addEventListener('scroll', highlightTimeline, {passive:true});

  var searchInput = document.getElementById('searchInput');
  var searchCount = document.getElementById('searchCount');
  var debounceTimer;
  if(searchInput){
    searchInput.addEventListener('input', function(){
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function(){
        var q = searchInput.value.trim().toLowerCase();
        var filtered;
        if(!q){ filtered = window.PAPERS; }
        else { filtered = window.PAPERS.filter(function(p){
          return (p.title && p.title.toLowerCase().indexOf(q)!==-1)
              || (p.summary && p.summary.toLowerCase().indexOf(q)!==-1)
              || (p.source && p.source.toLowerCase().indexOf(q)!==-1)
              || (p.badgeLabel && p.badgeLabel.toLowerCase().indexOf(q)!==-1);
        }); }
        searchCount.textContent = filtered.length + ' 篇';
        buildCards(filtered);
      }, 250);
    });
  }

  buildCards(window.PAPERS);
  buildTimeline();

  /* ---- back to top ---- */
  var qtop = document.getElementById('quickTop');
  window.addEventListener('scroll', function(){
    qtop.classList.toggle('visible', window.scrollY > 400);
  });
})();

</script>

<div class="quick-top" id="quickTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
