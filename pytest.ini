# ======================================================================
# 【白盒测试修改标识｜2026-10-18｜新增】
# 文件：pytest.ini
# 修改内容及原因：统一测试发现范围与标记检查，替代原来无法统计分支的手工执行方式。
# 范围：仅测试/测试配置；不修改生产逻辑，不执行真实外部发布。
# ======================================================================
[pytest]
testpaths = test
python_files = test_*.py
addopts = -ra --strict-markers
